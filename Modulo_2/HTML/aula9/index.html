<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <form>
        <label>Nome: </label>
        <br>
        <input type="text" name="nome" placeholder="Digite seu nome">
        <br><br>

        <label>Idade: </label>
        <br><input type="number" name="idade" placeholder="Sua idade">
        <br><br>

        <label>Email: </label>
        <br><input type="email" name="email" placeholder="Seu email">
        <br><br>

        <label>Senha: </label>
        <br><input type="password" name="senha" placeholder="Sua senha">
        <br><br>
        
        <label>Sexo: </label>
        <br><input type="radio" name="sexo" value="masculino"> masculino
        <br><input type="radio" name="sexo" value="feminino"> feminino
        <br><input type="radio" name="sexo" value="outro"> outro
        <br><br>

        <label>Estilos musicais</label>
        <br><input type="checkbox" name="escolha" value="pagode"> pagode
        <br><input type="checkbox" name="escolha" value="samba"> samba
        <br><input type="checkbox" name="escolha" value="MPB"> MPB
        <br><input type="checkbox" name="escolha" value="funk"> funk
        <br><input type="checkbox" name="escolha" value="phonk"> phonk
        <br><input type="checkbox" name="escolha" value="metal"> metal
        <br><input type="checkbox" name="escolha" value="rock"> rock
        <br><input type="checkbox" name="escolha" value="sertanejo"> sertanejo
        <br><input type="checkbox" name="escolha" value="dubstep"> dubstep
        <br><br>

        <label>escolaridade</label>
        <select>
        <option>fundamental I</option>
        <option>fundamental II</option>
        <option>ensino médio</option>
        <option>faculdade</option>
        <option>ensino técnico</option>
        <option>mestrado</option>
        <option>doutorado</option>
        </select>
        <br><br>

        <label>Data de nascimento</label>
        <input type="date" name="dn">
        <br><br>

        <label>Letra da sua musica favorita(opcional)</label><br><br>
        <textarea name="letra" rows="50" cols="30"></textarea>
        <br><br>
        
        <input type="submit" value="enviar">
        <input type="reset" value="limpar">
        

    </form>
    
</body>
</html>
